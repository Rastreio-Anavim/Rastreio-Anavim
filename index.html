<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rastreio de Pedidos · ANAVIM</title>
<script>
  // aplica o tema antes de desenhar a página (evita "piscar" branco)
  (function(){ var t=null; try{ t=JSON.parse(localStorage.getItem('rastreio_anavim_tema')); }catch(e){}
    if(!t) t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t); })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --navy:#121F3A; --navy-2:#1C2C4F; --orange:#E2892A; --teal:#659EA0;
  --bg:#F3F4F7; --panel:#FFFFFF; --panel-2:#EEF1F6; --row-alt:#FBFCFD; --input:#FFFFFF;
  --line:#DDE1E8; --line-2:#EDF0F4; --line-3:#CBD2DD;
  --text:#1B2233; --text-2:#3A4660; --muted:#667085; --faint:#B5BCC8;
  --hover:#F4F7FB; --sel:#FFF4E8; --warn-bg:#FFF4E8; --warn-line:#F2D2AE;
  --ok:#2E8B57; --err:#C0392B; --ok-bg:#E4F3EA; --shadow:rgba(18,31,58,.22);
  --header:#121F3A; --header-line:#3A4B70;
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#0D1424; --panel:#141D31; --panel-2:#1B2640; --row-alt:#172035; --input:#0F1729;
  --line:#28344F; --line-2:#212C45; --line-3:#35425F;
  --text:#E4E8F0; --text-2:#C3CBDA; --muted:#8C97AD; --faint:#566079;
  --hover:#1D2842; --sel:#3A2A17; --warn-bg:#33261A; --warn-line:#5C4326;
  --ok-bg:#16352A; --shadow:rgba(0,0,0,.5);
  --header:#0A101D; --header-line:#2A3754;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.35 'Barlow',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--input)}
.hidden{display:none!important}

/* ---------- topo ---------- */
header{background:var(--header);color:#fff;display:flex;align-items:center;gap:16px;padding:8px 18px;border-bottom:3px solid var(--orange);min-height:62px}
.brand{display:flex;align-items:center;gap:14px}
.brand img{height:40px;display:block}
.brand .sep{width:1px;height:34px;background:rgba(255,255,255,.22)}
.brand h1{font:700 22px/1 'Barlow Condensed',sans-serif;letter-spacing:.5px;margin:0;text-transform:uppercase}
.brand h1 span{color:var(--orange)}
.brand small{display:block;font:500 11px 'DM Mono',monospace;color:#AEB8CC;letter-spacing:.8px;margin-top:4px}
.tabs{display:flex;gap:4px;margin-left:18px;align-self:stretch;align-items:flex-end}
.tab{background:transparent;border:0;color:#AEB8CC;font:600 15px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.5px;padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-11px}
.tab:hover{color:#fff}
.tab.on{color:#fff;border-bottom-color:#fff}
.tab b{font:500 11px 'DM Mono',monospace;background:var(--err);color:#fff;border-radius:99px;padding:1px 6px;margin-left:4px;vertical-align:2px}
header .grow{flex:1}
.user{font:12px 'DM Mono',monospace;color:#C7CFDD}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:500}
.btn:hover{border-color:var(--line-3);background:var(--hover)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.primary:hover{filter:brightness(.95);background:var(--orange)}
.btn.dark{background:transparent;border-color:var(--header-line);color:#fff}
.btn.dark:hover{background:var(--navy-2)}
.btn.icon{padding:7px 9px}
.btn.danger{color:var(--err);border-color:color-mix(in srgb,var(--err) 35%,var(--line))}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:15px;height:15px}

/* ---------- barra de ferramentas ---------- */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.search{position:relative}
.search input{width:280px;padding:7px 10px 7px 30px;border:1px solid var(--line);border-radius:6px}
.search svg{position:absolute;left:9px;top:9px;width:14px;height:14px;color:var(--muted)}
.count{font:12px 'DM Mono',monospace;color:var(--muted);margin-left:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.chipgrp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chipgrp>em{font:600 12px 'Barlow Condensed',sans-serif;text-transform:uppercase;color:var(--muted);font-style:normal;margin-right:2px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px 3px 8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:12.5px}
.chip b{font:500 12px 'DM Mono',monospace}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip.on{border-color:var(--orange);box-shadow:inset 0 0 0 1px var(--orange)}
.pbtn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 11px;cursor:pointer;font:500 13px 'Barlow',sans-serif}
.pbtn:hover:not(:disabled){border-color:var(--line-3);background:var(--hover)}
.pbtn.on,.pbtn.on:hover:not(:disabled){background:var(--navy);border-color:var(--navy);color:#fff}
[data-theme="dark"] .pbtn.on,[data-theme="dark"] .pbtn.on:hover:not(:disabled){background:var(--orange);border-color:var(--orange)}
.pbtn:disabled{opacity:.35;cursor:default}
.period{gap:8px 22px;align-items:center}
.ptip{font-size:11.5px;color:var(--muted);margin-left:auto}
.bulk{display:flex;align-items:center;gap:8px;padding:8px 18px;background:var(--warn-bg);border-bottom:1px solid var(--warn-line);font-size:13px}
.bulk select{padding:6px 8px;border:1px solid var(--line);border-radius:6px}

/* ---------- tabela ---------- */
.wrap{position:absolute;left:0;right:0;bottom:0;overflow:auto;background:var(--panel)}
table.grid{border-collapse:separate;border-spacing:0;table-layout:fixed;width:max-content;min-width:100%}
.grid th,.grid td{border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:0;text-align:left;vertical-align:top}
.grid thead th{position:sticky;top:0;z-index:3;background:var(--panel-2);border-bottom:1px solid var(--line);height:38px;vertical-align:middle;user-select:none}
th .h{display:flex;align-items:center;height:100%;padding:0 4px 0 9px;gap:4px}
th .lbl{flex:1;font:600 13px/1.1 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.3px;color:var(--text-2);cursor:grab;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:6px 0}
th .lbl:active{cursor:grabbing}
th .srt{font-size:10px;color:var(--orange)}
.fbtn{width:24px;height:22px;border:1px solid var(--line-3);background:var(--panel);border-radius:4px;cursor:pointer;display:grid;place-items:center;padding:0;flex:none}
.fbtn svg{width:11px;height:11px;color:var(--muted)}
.fbtn.on{background:var(--orange);border-color:var(--orange)}
.fbtn.on svg{color:#fff}
.rz{position:absolute;right:-3px;top:0;bottom:0;width:7px;cursor:col-resize;z-index:4}
th.drop-l{box-shadow:inset 3px 0 0 var(--orange)}
th.drop-r{box-shadow:inset -3px 0 0 var(--orange)}
.selc{width:36px;text-align:center;position:sticky;left:0;z-index:2;background:inherit}
.grid thead th.selc{z-index:5;background:var(--panel-2)}
.grid tbody tr{background:var(--panel)}
.grid tbody tr:nth-child(even){background:var(--row-alt)}
.grid tbody tr:hover{background:var(--hover)}
.grid tbody tr.sel{background:var(--sel)}
td .c{padding:7px 9px;min-height:33px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.wrap-text td.long .c{white-space:pre-wrap;word-break:break-word}
td.num .c{text-align:right;font-family:'DM Mono',monospace;font-size:12.5px}
td.id .c{font-family:'DM Mono',monospace;font-size:12.5px}
td.ro .c{color:var(--muted);font-size:12.5px}
td[data-k]:not(.ro):not(.st){cursor:cell}
td.empty .c{color:var(--faint)}
td.man .c{position:relative;font-style:italic}
td.man .c:after{content:'';position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--orange)}
td.saving{outline:2px solid var(--teal);outline-offset:-2px}
td.saved{animation:flash 1s}
@keyframes flash{from{background:var(--ok-bg)}to{background:transparent}}
td.st .c{padding:4px 6px;display:flex;align-items:center;gap:4px}
.stsel{flex:1;min-width:0;border:1px solid transparent;border-radius:999px;padding:4px 22px 4px 8px;font-weight:600;font-size:12.5px;cursor:pointer;appearance:none;-webkit-appearance:none;
  color:var(--c);background-color:var(--b);
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 13px) 50%,calc(100% - 9px) 50%;background-size:4px 4px;background-repeat:no-repeat}
.stsel option{color:var(--text);background:var(--panel)}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-weight:600;font-size:12px;color:var(--c);background:var(--b)}
[data-theme="dark"] .stsel,[data-theme="dark"] .pill{color:color-mix(in srgb,var(--c) 45%,#fff);background-color:color-mix(in srgb,var(--c) 30%,transparent)}
td.sit .c{padding:6px 8px}
.hist{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:2px;display:grid;place-items:center}
.hist:hover{color:var(--orange)}
.hist svg{width:14px;height:14px}
.more{padding:14px;text-align:center}
.emptymsg{padding:60px 20px;text-align:center;color:var(--muted)}

/* ---------- aba de prazos ---------- */
.pz{position:absolute;left:0;right:0;bottom:0;overflow:auto;padding:16px 18px 40px}
.pzbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:16px;overflow:hidden}
.pzbox h3{margin:0;padding:12px 16px;font:700 16px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
.pzbox h3 small{font:400 12.5px 'Barlow',sans-serif;text-transform:none;color:var(--muted);letter-spacing:0}
.pzbox.alert h3{color:var(--err)}
table.simple{width:100%;border-collapse:collapse}
.simple th{text-align:left;font:600 12.5px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.3px;color:var(--text-2);background:var(--panel-2);padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
.simple td{padding:7px 12px;border-bottom:1px solid var(--line-2)}
.simple tr:hover td{background:var(--hover)}
.simple td.n{font-family:'DM Mono',monospace;font-size:12.5px;text-align:right}
.simple th.n{text-align:right}
.simple td.act{text-align:right;white-space:nowrap}
.simple .todas{color:var(--muted);font-style:italic}

/* ---------- editor ---------- */
.editor{position:fixed;z-index:50;background:var(--panel);border:2px solid var(--orange);border-radius:4px;box-shadow:0 8px 24px var(--shadow)}
.editor input,.editor textarea{width:100%;border:0;outline:0;padding:7px 9px;background:transparent;display:block}
.editor textarea{min-height:130px;resize:vertical;line-height:1.4}
.editor .hint{font:11px 'DM Mono',monospace;color:var(--muted);padding:4px 9px;border-top:1px solid var(--line-2)}

/* ---------- menu de filtro ---------- */
.fmenu{position:fixed;z-index:60;width:290px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 32px var(--shadow);font-size:13px;display:flex;flex-direction:column;max-height:min(520px,calc(100vh - 20px))}
.fmenu .it{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.fmenu .it:hover{background:var(--hover)}
.fmenu .it:disabled{color:var(--faint);cursor:default;background:none}
.fmenu hr{border:0;border-top:1px solid var(--line-2);margin:4px 0}
.fmenu .fs{padding:6px 12px}
.fmenu .fs input{width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:5px}
.fmenu .list{overflow:auto;margin:0 12px;border:1px solid var(--line-2);border-radius:5px;min-height:80px;flex:1}
.fmenu label{display:flex;align-items:center;gap:8px;padding:4px 8px;cursor:pointer;white-space:nowrap}
.fmenu label:hover{background:var(--hover)}
.fmenu label span{flex:1;overflow:hidden;text-overflow:ellipsis}
.fmenu label em{font:normal 11px 'DM Mono',monospace;color:var(--muted)}
.fmenu .ft{display:flex;justify-content:flex-end;gap:8px;padding:10px 12px}
.fmenu .note{font-size:11.5px;color:var(--muted);padding:4px 12px 0}

/* ---------- modais ---------- */
.ov{position:fixed;inset:0;background:rgba(5,10,20,.55);z-index:80;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border-radius:10px;width:min(560px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.modal h2{font:700 19px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.4px;margin:0;padding:16px 20px;border-bottom:1px solid var(--line-2)}
.modal .bd{padding:16px 20px;overflow:auto}
.modal .ft{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13.5px}
.kv b{font:500 13px 'DM Mono',monospace}
.warn{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:6px;padding:8px 10px;font-size:12.5px;margin-top:12px}
.prog{height:8px;background:var(--line-2);border-radius:99px;overflow:hidden;margin-top:14px}
.prog div{height:100%;width:0;background:var(--teal);transition:width .2s}
.colist{list-style:none;margin:0;padding:0}
.colist li{display:flex;align-items:center;gap:10px;padding:7px 8px;border:1px solid var(--line-2);border-radius:6px;margin-bottom:5px;background:var(--panel);cursor:grab}
.colist li.dragging{opacity:.4}
.colist .grip{color:var(--faint);font-size:14px;letter-spacing:-2px}
.colist li span{flex:1}
.colist li small{color:var(--muted);font-size:11px}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{border-left:2px solid var(--line);padding:0 0 14px 14px;position:relative}
.timeline li:before{content:'';position:absolute;left:-6px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--teal)}
.timeline .when{font:12px 'DM Mono',monospace;color:var(--muted)}
.timeline .obs{font-size:12.5px;color:var(--text-2);margin-top:2px;white-space:pre-wrap}

/* ---------- telas de acesso ---------- */
.gate{min-height:100vh;display:grid;place-items:center;background:var(--navy);padding:16px}
.card{background:var(--panel);border-radius:12px;padding:28px;width:min(400px,100%);box-shadow:0 20px 50px rgba(0,0,0,.35);border-top:4px solid var(--orange)}
.card .logo{background:var(--navy);border-radius:8px;padding:12px;display:grid;place-items:center;margin-bottom:18px}
.card .logo img{height:44px}
.card h2{font:700 24px 'Barlow Condensed',sans-serif;text-transform:uppercase;margin:0 0 4px}
.card p{margin:0 0 18px;color:var(--muted);font-size:13px}
.field{margin-bottom:12px}
.field label{display:block;font:600 12px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.4px;color:var(--text-2);margin-bottom:4px}
.field input,.field select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px}
.field small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card .btn{width:100%;justify-content:center;padding:10px}
.link{background:none;border:0;color:var(--teal);cursor:pointer;font-size:12.5px;margin-top:12px;padding:0}
.err{color:var(--err);font-size:13px;min-height:18px;margin-bottom:6px}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;z-index:100;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw;border:1px solid var(--header-line)}
.toast.err{background:var(--err);border-color:var(--err)}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 70%,transparent);z-index:70;font:600 16px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.5px}
@media (max-width:900px){.search input{width:180px}.brand small,.brand .sep{display:none}header{flex-wrap:wrap}.tabs{margin-left:0}}
</style>
</head>
<body>

<!-- ============ CONFIGURAÇÃO DO SUPABASE ============ -->
<div id="scrCfg" class="gate hidden">
  <form class="card" id="cfgForm">
    <h2>Conectar ao Supabase</h2>
    <p>Supabase &gt; Project Settings &gt; API. Fica salvo neste navegador.</p>
    <div class="field"><label>Project URL</label><input id="cfgUrl" placeholder="https://xxxx.supabase.co" required></div>
    <div class="field"><label>Anon / Publishable key</label><input id="cfgKey" placeholder="sb_publishable_..." required></div>
    <div class="err" id="cfgErr"></div>
    <button class="btn primary" type="submit">Salvar e continuar</button>
  </form>
</div>

<!-- ============ LOGIN ============ -->

function splitMensagem(raw){
  if(raw === null || raw === undefined) return {mensagem:null, endereco:null, original:null};
  const t = String(raw).replace(/\r\n?/g,'\n').trim();
  if(!t) return {mensagem:null, endereco:null, original:null};
  const clean = s => s.split('\n').map(x=>x.trim()).filter(Boolean).join('\n');
  const m = t.match(/endere[çc]o\s+(de\s+)?entrega\s*[:\-–]?/i);
  if(m){
    const msg = t.slice(0, m.index).trim();
    const end = clean(t.slice(m.index + m[0].length));
    return {mensagem: msg || null, endereco: end || null, original:t};
  }
  const lines = t.split('\n').map(x=>x.trim()).filter(Boolean);
  if(lines.length >= 2 && /\b\d{5}-?\d{3}\b/.test(t)){
    return {mensagem: lines[0], endereco: lines.slice(1).join('\n'), original:t};
  }
  return {mensagem:t, endereco:null, original:t};
}

  h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  return Date.UTC(y,mo-1,da); }
function holidays(y){
  if(holCache[y]) return holCache[y];
  const s = new Set(['01-01','04-21','05-01','09-07','10-12','11-02','11-15','11-20','12-25'].map(md=>`${y}-${md}`));
  const e = easter(y), d = off => new Date(e + off*86400000).toISOString().slice(0,10);
  [-48,-47,-2,60].forEach(o=>s.add(d(o)));   // Carnaval (seg/ter), Sexta-feira Santa, Corpus Christi
  return holCache[y] = s;
}
function isBusinessDay(ms){ const d=new Date(ms), w=d.getUTCDay(); if(w===0||w===6) return false; const iso=d.toISOString().slice(0,10); return !holidays(d.getUTCFullYear()).has(iso); }
function addDays(iso, n, tipo){

  if(tipo === 'corridos') ms += n*86400000;
  else { let left=n; while(left>0){ ms += 86400000; if(isBusinessDay(ms)) left--; } }

function localISO(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }

/* ---------------- conversões de valor ---------------- */
function serialParts(serial){
  const total = Math.round(serial * 86400);
  const days = Math.floor(total / 86400), secs = total - days*86400;
  const d = new Date(Date.UTC(1899,11,30) + days*86400000);
  return {y:d.getUTCFullYear(), m:d.getUTCMonth()+1, d:d.getUTCDate(), H:Math.floor(secs/3600), M:Math.floor(secs%3600/60), S:secs%60};
}
function parseBRNumber(v){
  if(typeof v === 'number') return v;
  let s = String(v).replace(/R\$|\s/g,'');
  if(!s) return null;
  if(s.includes(',')) s = s.replace(/\./g,'').replace(',', '.');
  const n = Number(s);
  if(!isFinite(n)) throw new Error('Número inválido: '+v);
  return n;
}
function parseDateStr(s){
  s = String(s).trim();
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
  if(m){ let y=+m[3]; if(y<100) y+=2000; return {y, m:+m[2], d:+m[1], H:+(m[4]||0), M:+(m[5]||0), S:+(m[6]||0)}; }

  if(m) return {y:+m[1], m:+m[2], d:+m[3], H:+(m[4]||0), M:+(m[5]||0), S:+(m[6]||0)};

}
const isoDate = p => `${p.y}-${pad(p.m)}-${pad(p.d)}`;
const isoTime = p => `${pad(p.H)}:${pad(p.M)}:${pad(p.S)}`;

function fromSheet(col, v){
  if(v === null || v === undefined || (typeof v === 'string' && v.trim() === '')) return null;
  switch(col.t){
    case 'id': case 'int': {
      if(typeof v === 'number') return Math.round(v);
      const d = String(v).replace(/\D/g,''); return d ? Number(d) : null;
    }
    case 'num': case 'money': return parseBRNumber(v);
    case 'date': {
      if(typeof v === 'number') return isoDate(serialParts(v));
      if(v instanceof Date) return localISO(v);
      const p = parseDateStr(v); return p ? isoDate(p) : null;
    }
    case 'datetime': {
      if(typeof v === 'number') { const p=serialParts(v); return isoDate(p)+'T'+isoTime(p); }
      const p = parseDateStr(v); return p ? isoDate(p)+'T'+isoTime(p) : null;
    }
    case 'time': {
      if(typeof v === 'number') return isoTime(serialParts(v % 1));
      const m = String(v).trim().match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);
      return m ? `${pad(m[1])}:${m[2]}:${m[3]||'00'}` : null;
    }
    default: return String(v).trim();
  }
}
function fmt(col, v){
  if(v === null || v === undefined || v === '') return '';
  switch(col.t){
    case 'id': return String(v);
    case 'int': return col.unit ? `${v} ${v==1?'dia':'dias'}` : String(v);
    case 'num': return numFmt.format(v);

    case 'date': { const [y,m,d] = String(v).slice(0,10).split('-'); return `${d}/${m}/${y}`; }
    case 'datetime': { const s=String(v); const [y,m,d]=s.slice(0,10).split('-'); return `${d}/${m}/${y} ${s.slice(11,16)}`; }
    case 'time': return String(v).slice(0,8);
    case 'ts': { const d=new Date(v); return isNaN(d) ? String(v) : d.toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}); }
    default: return String(v);
  }
}

  if(v === null || v === undefined || v === '') return '';

function cellHtml(c, r){
  const v = r[c.k];
  if(c.t === 'status'){
    const si = statusInfo(v);
    const style = si ? `--c:${si.cor};--b:${si.bg}` : '--c:#98A2B3;--b:transparent;border-color:var(--line)';

      .concat(STATUS_ENTREGA.map(s=>`<option ${s.v===v?'selected':''}>${esc(s.v)}</option>`))
      .concat(v && !si ? [`<option selected>${esc(v)}</option>`] : []).join('');
    return `<td class="st" data-k="${c.k}"><div class="c"><select class="stsel" data-st="${r.pedido}" style="${style}">${opts}</select>
      <button class="hist" data-h="${r.pedido}" title="Histórico de status">${ICON_H}</button></div></td>`;
  }
  if(c.t === 'sit'){
    const si = sitInfo(v) || {cor:'#667085', bg:'#EEF0F3'};
    return `<td class="ro sit" data-k="${c.k}"><div class="c">${v?`<span class="pill" style="--c:${si.cor};--b:${si.bg}">${esc(v)}</span>`:''}</div></td>`;
  }
  const txt = fmt(c, v);
  const manual = c.edit && r[c.edit] !== null && r[c.edit] !== undefined;
  const cls = [c.t==='num'||c.t==='money'||c.t==='int'?'num':'', c.t==='id'?'id':'', c.t==='long'?'long':'', c.ro?'ro':'', txt===''?'empty':'', manual?'man':''].join(' ');
  const shownTxt = c.t==='long' && !document.body.classList.contains('wrap-text') ? txt.replace(/\s*\n\s*/g,' · ') : txt;
  const title = manual ? ' title="Alterado manualmente — apague o valor para voltar ao cálculo automático"' : c.t==='long'&&txt ? ` title="${esc(txt)}"` : '';
  return `<td class="${cls}" data-k="${c.k}"${title}><div class="c">${esc(shownTxt)}</div></td>`;
}
function chipGroup(label, key, items){

let fmenu = null;
function placeFilter(){ if(!fmenu) return; const r = fmenu._anchor.getBoundingClientRect();
  fmenu.style.top = Math.max(8, Math.min(r.bottom+4, window.innerHeight - fmenu.offsetHeight - 10)) + 'px';
  fmenu.style.left = Math.max(8, Math.min(r.right - 290, window.innerWidth - 300)) + 'px'; }
function closeFilter(){ if(fmenu){ fmenu.remove(); fmenu=null; } }
function openFilter(k, anchor){
  closeFilter();
  const c = COL[k];
  const base = filtered(k);
  const map = new Map();
  base.forEach(r=>{ const key=fkey(c, r[k]); const e=map.get(key); if(e) e.n++; else map.set(key,{raw:r[k],n:1}); });
  const items = [...map.entries()].sort((a,b)=>cmp(c, a[0]===''?null:a[1].raw, b[0]===''?null:b[1].raw));
  const cur = filters[k];
  const checked = new Set(items.filter(([key])=>!cur || cur.has(key)).map(([key])=>key));
  const isNum = ['id','int','num','money'].includes(c.t), isDate = ['date','datetime','ts'].includes(c.t);
  const az = isNum ? 'Menor para o maior' : isDate ? 'Mais antigo para o mais novo' : 'Classificar de A a Z';
  const za = isNum ? 'Maior para o menor' : isDate ? 'Mais novo para o mais antigo' : 'Classificar de Z a A';

  fmenu = document.createElement('div'); fmenu.className = 'fmenu'; fmenu.dataset.k = k;
  fmenu.innerHTML = `
    <button class="it" data-a="asc">↑ ${az}</button>
    <button class="it" data-a="desc">↓ ${za}</button>
    <button class="it" data-a="clr" ${cur?'':'disabled'}>✕ Limpar filtro de “${esc(c.l)}”</button>
    <hr><div class="fs"><input placeholder="Pesquisar" id="fq"></div>
    <div class="list" id="fl"></div>
    ${items.length>2000?'<div class="note">Mostrando os 2000 primeiros; use a pesquisa.</div>':''}
    <div class="ft"><button class="btn" data-a="cancel">Cancelar</button><button class="btn primary" data-a="ok">OK</button></div>`;
  document.body.appendChild(fmenu);
  fmenu._anchor = anchor; placeFilter();

  const fq = fmenu.querySelector('#fq'), fl = fmenu.querySelector('#fl');
  let visible = items;
  const draw = () => {
    const q = norm(fq.value);
    visible = q ? items.filter(([key])=>norm(key===''?'(vazias)':key).includes(q)) : items;
    const allOn = visible.length && visible.every(([key])=>checked.has(key));
    fl.innerHTML = `<label><input type="checkbox" data-all ${allOn?'checked':''}><span><b>${q?'(Selecionar todos os resultados)':'(Selecionar tudo)'}</b></span></label>` +
      visible.slice(0,2000).map(([key,e],i)=>`<label><input type="checkbox" data-i="${i}" ${checked.has(key)?'checked':''}><span>${key===''?'<i>(Vazias)</i>':esc(key)}</span><em>${e.n}</em></label>`).join('');
  };
  draw();
  fq.addEventListener('input', draw);
  fl.addEventListener('change', e=>{
    const t = e.target;
    if(t.hasAttribute('data-all')){ visible.forEach(([key])=> t.checked ? checked.add(key) : checked.delete(key)); draw(); }
    else { const key = visible[+t.dataset.i][0]; t.checked ? checked.add(key) : checked.delete(key);
      fl.querySelector('[data-all]').checked = visible.every(([k2])=>checked.has(k2)); }
  });
  fmenu.addEventListener('click', e=>{
    const a = e.target.closest('[data-a]')?.dataset.a; if(!a) return;
    if(a==='asc'||a==='desc'){ sort = {k, dir:a==='asc'?1:-1}; }
    else if(a==='clr'){ delete filters[k]; }
    else if(a==='ok'){
      const q = fq.value.trim();
      const allowed = new Set((q ? visible : items).map(([key])=>key).filter(key=>checked.has(key)));
      if(!q && allowed.size === items.length) delete filters[k]; else filters[k] = allowed;
    }
    closeFilter(); limit = PAGE; render();
  });
  fq.focus();
}

/* ---------------- edição de células ---------------- */
function openEditor(td){
  const k = td.dataset.k, c = COL[k]; if(c.ro || c.t==='status' || c.t==='sit') return;
  const id = Number(td.parentElement.dataset.id), row = byId.get(id); if(!row) return;
  closeEditor(false);
  const rect = td.getBoundingClientRect();
  const ed = document.createElement('div'); ed.className = 'editor';
  const long = c.t === 'long';
  const type = {date:'date', datetime:'datetime-local', time:'time', int:'number'}[c.t] || 'text';
  const hint = c.edit ? '<div class="hint">Enter salva · vazio volta ao automático</div>' : '';
  ed.innerHTML = long
    ? `<textarea>${esc(toInput(c,row[k]))}</textarea><div class="hint">Ctrl+Enter salva · Esc cancela</div>`
    : `<input type="${type}" ${type==='number'?'min="0" step="1"':type!=='text'?'step="1"':''} value="${esc(toInput(c,row[k]))}">${hint}`;
  const w = Math.max(rect.width, long ? 360 : c.edit ? 240 : type==='datetime-local' ? 220 : 150);
  ed.style.left = Math.min(rect.left, window.innerWidth - w - 10) + 'px';
  ed.style.top = (long ? Math.min(rect.top, window.innerHeight - 190) : rect.top) + 'px';
  ed.style.width = w + 'px';
  document.body.appendChild(ed);
  const inp = ed.querySelector('input,textarea');
  inp.focus(); if(inp.select && (type==='text'||type==='number')) inp.select();
  editorOpen = {ed, inp, td, id, k};
  inp.addEventListener('keydown', e=>{
    if(e.key==='Escape'){ e.preventDefault(); closeEditor(false); }
    else if(e.key==='Enter' && (!long || e.ctrlKey || e.metaKey)){ e.preventDefault(); closeEditor(true); }
    else if(e.key==='Tab'){ e.preventDefault(); const next = e.shiftKey ? td.previousElementSibling : td.nextElementSibling; closeEditor(true); if(next?.dataset.k) openEditorLater(next); }
  });
  inp.addEventListener('blur', ()=> setTimeout(()=>{ if(editorOpen && editorOpen.inp===inp) closeEditor(true); }, 120));
}
function openEditorLater(td){ const id=td.parentElement.dataset.id, k=td.dataset.k;
  setTimeout(()=>{ const el=document.querySelector(`tr[data-id="${id}"] td[data-k="${k}"]`); if(el) openEditor(el); }, 30); }
function closeEditor(save){
  if(!editorOpen) return;
  const {ed, inp, id, k} = editorOpen;
  const c = COL[k], row = byId.get(id);
  if(save && row){
    let val;
    try{ val = fromInput(c, inp.value); }
    catch(err){ toast(err.message, true); inp.focus(); return; }
    ed.remove(); editorOpen = null;
    if(c.edit){                                  // coluna calculada: grava o valor manual
      const cur = row[c.edit] ?? null;
      const typedSame = val !== null && val === row[k] && cur === null;   // confirmou o automático sem mudar
      if(!typedSame && val !== cur) saveCell(id, {[c.edit]: val});
    } else {
      const oldV = row[k];
      const same = (oldV ?? null) === (val ?? null) || (c.t==='datetime' && String(oldV||'').slice(0,19)===String(val||'').slice(0,19));
      if(!same) saveCell(id, {[k]: val});
    }
  } else { ed.remove(); editorOpen = null; }
  if(pendingRender){ pendingRender = false; render(); }
}
$('#wrap').addEventListener('scroll', ()=>{
  placeFilter();
  if(editorOpen){ const r = editorOpen.td.getBoundingClientRect(), ed = editorOpen.ed;
    ed.style.left = Math.min(r.left, window.innerWidth - ed.offsetWidth - 10) + 'px';
    if(editorOpen.inp.tagName==='INPUT') ed.style.top = r.top + 'px'; }
});

/* regras de entrega: data preenchida → status dentro/fora; status "Entregue…" sem data → data de hoje */
function applyDeliveryRules(row, patch){
  const p = {...patch};
  if('data_entrega' in p && p.data_entrega){
    const tmp = {...row, ...p}; derive(tmp, todayISO());
    if(tmp._previsao) p.status_entrega = p.data_entrega <= tmp._previsao ? 'Entregue dentro do prazo' : 'Entregue fora do prazo';
    else toast('Pedido sem previsão de entrega: escolha o status manualmente.');
  }
  if('status_entrega' in patch){
    if(isEntregue(p.status_entrega) && !row.data_entrega && !('data_entrega' in p)){
      p.data_entrega = todayISO();
      const tmp = {...row, ...p}; derive(tmp, todayISO());
      const certo = tmp._previsao ? (p.data_entrega <= tmp._previsao ? 'Entregue dentro do prazo' : 'Entregue fora do prazo') : null;
      if(certo && certo !== p.status_entrega) toast(`Entregue Dia ficou como hoje. Pela previsão (${fmt({t:'date'},tmp._previsao)}) seria “${certo}” — se a entrega foi em outra data, ajuste o Entregue Dia.`, true);
    }
    if(!isEntregue(p.status_entrega) && row.data_entrega) p.data_entrega = null;
  }
  return p;
}
async function saveCell(id, patch){
  const row = byId.get(id); if(!row) return;
  patch = applyDeliveryRules(row, patch);
  const backup = {...row};
  Object.assign(row, patch);
  if('pedido' in patch){ if(byId.has(patch.pedido) && patch.pedido!==id){ Object.assign(row, backup); toast('Já existe o pedido '+patch.pedido, true); return; } if(selected.delete(id)) selected.add(patch.pedido); }
  indexRows(); render();
  const marks = COLS.filter(c=>c.k in patch || (c.edit && c.edit in patch)).map(c=>c.k);
  markCell(row.pedido, marks, 'saving');
  const {data, error} = await supa.from('pedidos').update(patch).eq('pedido', id).select().single();
  if(error){
    Object.keys(row).forEach(k=>delete row[k]); Object.assign(row, backup); indexRows(); render();
    toast('Não salvou: ' + error.message, true); return;
  }
  Object.assign(row, data); indexRows(); render();
  markCell(row.pedido, marks, 'saved');
}
function markCell(id, keys, cls){
  keys.forEach(k=>{ const td=document.querySelector(`tr[data-id="${id}"] td[data-k="${k}"]`); if(td){ td.classList.add(cls); if(cls==='saved') setTimeout(()=>td.classList.remove('saved'),1000);} });
}

$('#bulkApply').onclick = async ()=>{
  const ids=[...selected], v=$('#bulkSt').value||null, today=todayISO();
  const groups = new Map(); let semPrev = 0;          // "status|data" → [pedidos]
  ids.forEach(id=>{ const r=byId.get(id); if(!r) return; let st=v, dt;
    if(v==='__auto'){ dt = r.data_entrega || today;
      if(!r._previsao){ semPrev++; return; }
      st = dt <= r._previsao ? 'Entregue dentro do prazo' : 'Entregue fora do prazo'; }
    else dt = isEntregue(v) ? (r.data_entrega || today) : null;
    const k = st+'|'+(dt||''); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(id); });
  loading(true, `Atualizando ${ids.length-semPrev} pedidos…`);
  for(const [k, list] of groups){
    const [st, dt] = k.split('|');
    for(let i=0;i<list.length;i+=200){
      const {error} = await supa.from('pedidos').update({status_entrega: st==='null'||st===''?null:st, data_entrega: dt||null}).in('pedido', list.slice(i,i+200));
      if(error){ loading(false); toast('Erro: '+error.message, true); return loadAll(); }
    }
  }
  loading(false);
  const n=ids.length-semPrev; toast(`${n} pedido${n===1?'':'s'} atualizado${n===1?'':'s'}` + (semPrev?` · ${semPrev} sem previsão de entrega ficou como estava`.replace('ficou como estava', semPrev===1?'ficou como estava':'ficaram como estavam'):''), !!semPrev);
  selected.clear(); loadAll();
};
$('#bulkDel').onclick = ()=>{

};

/* ---------------- modal genérico ---------------- */
function modal(title, body, buttons){
  const ov = document.createElement('div'); ov.className='ov';
  ov.innerHTML = `<div class="modal"><h2>${esc(title)}</h2><div class="bd">${body}</div><div class="ft"></div></div>`;
  const close = ()=> ov.remove();
  const ft = ov.querySelector('.ft');
  buttons.forEach(b=>{ const el=document.createElement('button'); el.className='btn '+(b.cls||''); el.textContent=b.t; if(b.id) el.id=b.id; el.onclick=()=> b.fn ? b.fn(close, ov) : close(); ft.appendChild(el); });
  ov.addEventListener('mousedown', e=>{ if(e.target===ov && !ov.dataset.lock) close(); });
  document.body.appendChild(ov);
  return {ov, close};
}

$('#btnCols').onclick = ()=>{

    {t:'Restaurar padrão', fn:()=>{ draft.order=COLS.map(c=>c.k); draft.hidden=new Set(COLS.filter(c=>c.hide).map(c=>c.k)); draw(); }},
    {t:'Mostrar todas', fn:()=>{ draft.hidden.clear(); draw(); }},
    {t:'Aplicar', cls:'primary', fn:close=>{ layout.order=draft.order; layout.hidden=[...draft.hidden]; saveLayout(); close(); render(); }}
  ]);
  const ul = m.ov.querySelector('#colist'); let dk=null;
  const tag = c => c.k.startsWith('_') ? '<small>calculado</small>' : c.ro ? '<small>automático</small>' : !c.x ? '<small>rastreio</small>' : '';
  const draw = ()=>{ ul.innerHTML = draft.order.map(k=>`<li draggable="true" data-k="${k}"><span class="grip">⋮⋮</span><input type="checkbox" ${draft.hidden.has(k)?'':'checked'}><span>${esc(COL[k].l)}</span>${tag(COL[k])}</li>`).join(''); };
  draw();
  ul.addEventListener('change', e=>{ const k=e.target.closest('li').dataset.k; e.target.checked?draft.hidden.delete(k):draft.hidden.add(k); });
  ul.addEventListener('dragstart', e=>{ const li=e.target.closest('li'); dk=li.dataset.k; li.classList.add('dragging'); });
  ul.addEventListener('dragend', ()=>{ dk=null; draw(); });
  ul.addEventListener('dragover', e=>{ e.preventDefault(); const li=e.target.closest('li'); if(!li||!dk||li.dataset.k===dk) return;
    const r=li.getBoundingClientRect(), after=e.clientY>r.top+r.height/2;
    const o=draft.order.filter(x=>x!==dk); let i=o.indexOf(li.dataset.k); if(after) i++; o.splice(i,0,dk);
    if(o.join()!==draft.order.join()){ draft.order=o; draw(); ul.querySelector(`[data-k="${dk}"]`).classList.add('dragging'); } });
};

$('#btnImport').onclick = ()=> $('#fileIn').click();
$('#fileIn').addEventListener('change', async e=>{
  const f = e.target.files[0]; e.target.value=''; if(!f) return;
  try{ const buf = await f.arrayBuffer(); prepareImport(f.name, XLSX.read(buf, {type:'array'})); }
  catch(err){ toast('Não consegui ler o arquivo: '+err.message, true); }
});
function readSheet(wb, mustHave){
  for(const sn of wb.SheetNames){
    const a = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, raw:true, defval:null, blankrows:false});
    const i = a.slice(0,20).findIndex(r=>r.some(v=>mustHave.includes(normHeader(v))));
    if(i>=0) return {sheet:sn, aoa:a, hIdx:i};
  }
  return null;
}
function prepareImport(name, wb){
  const byHeader = new Map(COLS.filter(c=>c.x).flatMap(c=>[c.x, ...(c.xs||[])].map(h=>[normHeader(h), c])));
  const rd = readSheet(wb, ['pedido']);
  if(!rd) return toast('Não achei a coluna "Pedido" na planilha.', true);
  const {sheet:ws, aoa, hIdx} = rd;
  const map = [], unknown = [];
  aoa[hIdx].forEach((h,i)=>{ if(h===null||h==='') return; const c=byHeader.get(normHeader(h)); if(c) map.push([i,c]); else unknown.push(String(h).trim()); });
  const hasMsg = map.some(([,c])=>c.k==='mensagem');
  const recs = new Map(); let bad = 0;
  const stamp = new Date().toISOString();
  for(const r of aoa.slice(hIdx+1)){
    const rec = {};
    try{ for(const [i,c] of map) rec[c.k] = fromSheet(c, r[i]); } catch(err){ bad++; continue; }
    if(!rec.pedido){ if(r.some(v=>v!==null&&v!=='')) bad++; continue; }
    if('cidade' in rec){ const sc = splitCidade(rec.cidade); if(sc){ rec.cidade = sc.cidade; if(!rec.estado) rec.estado = sc.uf; } if(!('estado' in rec)) rec.estado = null; }
    if(rec.estado) rec.estado = String(rec.estado).toUpperCase();
    if(hasMsg){ const s = splitMensagem(rec.mensagem); rec.mensagem=s.mensagem; rec.endereco_entrega=s.endereco; rec.mensagem_original=s.original; }
    rec.importado_em = stamp;
    recs.set(rec.pedido, rec);
  }
  const list = [...recs.values()];
  if(!list.length) return toast('Nenhum pedido encontrado na planilha.', true);
  const novos = list.filter(r=>!byId.has(r.pedido)).length;
  const comEnd = list.filter(r=>r.endereco_entrega).length;
  const missing = COLS.filter(c=>c.x && c.k!=='estado' && !map.some(([,m])=>m.k===c.k)).map(c=>c.x);
  const body = `<div class="kv">
      <span>Arquivo</span><b>${esc(name)} · ${esc(ws)}</b>
      <span>Pedidos na planilha</span><b>${list.length}</b>
      <span>Novos (entram como “Em trânsito”)</span><b>${novos}</b>
      <span>Já existentes (serão atualizados)</span><b>${list.length-novos}</b>
      <span>Com endereço de entrega separado</span><b>${comEnd}</b>
      ${bad?`<span>Linhas ignoradas</span><b>${bad}</b>`:''}
    </div>
    <div class="warn">São mantidos: <b>Status Entrega</b>, <b>Observação Entrega</b> e prazos alterados à mão. As colunas da planilha substituem o que está no sistema.</div>
    ${missing.length?`<div class="warn">Colunas que não vieram (ficam como estão): ${esc(missing.join(', '))}</div>`:''}
    ${unknown.length?`<div class="warn">Colunas da planilha não reconhecidas (ignoradas): ${esc(unknown.join(', '))}</div>`:''}
    <div class="prog hidden" id="prog"><div></div></div>`;
  modal('Importar planilha', body, [
    {t:'Cancelar'},
    {t:'Importar', cls:'primary', fn: async (close, ov)=>{
      ov.dataset.lock = 1; ov.querySelectorAll('.ft .btn').forEach(b=>b.disabled=true);
      const pg = ov.querySelector('#prog'); pg.classList.remove('hidden');
      importing = true;
      const B = 500;
      for(let i=0;i<list.length;i+=B){
        const {error} = await supa.from('pedidos').upsert(list.slice(i,i+B), {onConflict:'pedido'});
        if(error){ importing=false; close(); toast('Erro na importação: '+error.message, true); return loadAll(); }
        pg.firstElementChild.style.width = Math.round(Math.min(100,(i+B)/list.length*100))+'%';
      }
      importing = false; close();
      toast(`Importado: ${novos} novos, ${list.length-novos} atualizados`);
      loadAll();
    }}
  ]);
}

/* ---------------- exportar pedidos ---------------- */
function writeXlsx(aoa, types, widths, sheetName, fileName){
  const ws = XLSX.utils.aoa_to_sheet(aoa, {cellDates:true});
  types.forEach((t,ci)=>{ const f = t==='date'?'dd/mm/yyyy':t==='datetime'||t==='ts'?'dd/mm/yyyy hh:mm':t==='money'?'"R$" #,##0.00':null;
    if(!f) return; for(let ri=1; ri<aoa.length; ri++){ const cell=ws[XLSX.utils.encode_cell({r:ri,c:ci})]; if(cell) cell.z=f; } });
  ws['!cols'] = widths.map(w=>({wch:w}));
  if(aoa.length>1) ws['!autofilter'] = {ref: ws['!ref']};
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, sheetName);
  XLSX.writeFile(wb, fileName);
}
const stampName = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
$('#btnExport').onclick = ()=>{
  const cols = visibleCols();
  const toCell = (c,v) => {
    if(v===null||v===undefined||v==='') return null;
    if(c.t==='date'){ const [y,m,d]=String(v).split('-'); return new Date(+y,+m-1,+d); }
    if(c.t==='datetime'){ const p=parseDateStr(v); return new Date(p.y,p.m-1,p.d,p.H,p.M,p.S); }
    if(c.t==='ts') return new Date(v);
    return v;
  };
  const aoa = [cols.map(c=>c.l)].concat(lastView.map(r=>cols.map(c=>toCell(c,r[c.k]))));
  writeXlsx(aoa, cols.map(c=>c.t), cols.map(c=>Math.max(10, Math.round((layout.widths[c.k]||c.w)/7))), 'Pedidos', `rastreio_anavim_${stampName()}.xlsx`);
};

/* =====================================================================
   ABA PRAZOS DE ENTREGA
   ===================================================================== */
let pzSort = {k:'transportadora', dir:1}, pzSearch = '';
const tipoLabel = t => t==='corridos' ? 'Dias corridos' : 'Dias úteis';
const UFS = ['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'];
const pzAlcance = p => p.cidade ? `${esc(p.cidade)}${p.estado?` / ${esc(p.estado)}`:''}` : p.estado ? `<span class="todas">Todas as cidades de ${esc(p.estado)}</span>` : '<span class="todas">Todas as cidades (padrão)</span>';

function missingCombos(){
  const m = new Map();
  rows.forEach(r=>{ if(r._prazo_ref || !r.transportador) return;
    const key = pzKey(r.transportador, r.cidade, r.estado);
    const e = m.get(key); if(e) e.n++; else m.set(key, {transportadora:r.transportador, cidade:r.cidade||'', estado:r.estado||'', n:1}); });
  return [...m.values()].sort((a,b)=>b.n-a.n || a.transportadora.localeCompare(b.transportadora,'pt-BR'));
}
function renderPrazos(){
  const q = norm(pzSearch);
  const uses = new Map(); rows.forEach(r=>{ if(r._prazo_ref) uses.set(r._prazo_ref,(uses.get(r._prazo_ref)||0)+1); });
  let list = prazos.filter(p=>!q || norm(p.transportadora+' '+p.cidade+' '+p.estado).includes(q));
  const k = pzSort.k;
  list.sort((a,b)=> (k==='prazo_dias' ? a.prazo_dias-b.prazo_dias : k==='uso' ? (uses.get(a.id)||0)-(uses.get(b.id)||0)
      : String(a[k]||'').localeCompare(String(b[k]||''),'pt-BR')) * pzSort.dir
      || a.transportadora.localeCompare(b.transportadora,'pt-BR') || String(a.estado).localeCompare(String(b.estado),'pt-BR') || String(a.cidade).localeCompare(String(b.cidade),'pt-BR'));
  const miss = missingCombos().filter(m=>!q || norm(m.transportadora+' '+m.cidade+' '+m.estado).includes(q));
  const arrow = key => pzSort.k===key ? (pzSort.dir>0?' ▲':' ▼') : '';

  $('#pzBody').innerHTML = `
    ${miss.length ? `<div class="pzbox alert"><h3>Sem prazo cadastrado <small>${miss.length} combinações de transportadora e cidade usadas nos pedidos</small></h3>
      <table class="simple"><thead><tr><th>Transportadora</th><th>Cidade</th><th>Estado</th><th class="n">Pedidos</th><th></th></tr></thead><tbody>
      ${miss.map((m,i)=>`<tr><td>${esc(m.transportadora)}</td><td>${esc(m.cidade)||'<span class="todas">(sem cidade)</span>'}</td><td>${esc(m.estado)}</td><td class="n">${m.n}</td>
        <td class="act"><button class="btn sm primary" data-miss="${i}">Cadastrar prazo</button></td></tr>`).join('')}
      </tbody></table></div>` : ''}
    <div class="pzbox"><h3>Prazos cadastrados <small>O sistema procura nesta ordem: cidade + estado → todas as cidades do estado → prazo padrão da transportadora.</small></h3>
      ${list.length ? `<table class="simple"><thead><tr>
        <th data-s="transportadora">Transportadora${arrow('transportadora')}</th><th data-s="cidade">Cidade${arrow('cidade')}</th><th data-s="estado">Estado${arrow('estado')}</th>
        <th data-s="prazo_dias" class="n">Prazo${arrow('prazo_dias')}</th><th data-s="tipo_dias">Tipo de dias${arrow('tipo_dias')}</th>
        <th data-s="uso" class="n">Pedidos usando${arrow('uso')}</th><th></th></tr></thead><tbody>
        ${list.map(p=>`<tr data-pz="${p.id}"><td>${esc(p.transportadora)}</td>
          <td>${p.cidade?esc(p.cidade):p.estado?`<span class="todas">Todas de ${esc(p.estado)}</span>`:'<span class="todas">Todas (padrão)</span>'}</td><td>${esc(p.estado||'')||'<span class="todas">Todos</span>'}</td>
          <td class="n">${p.prazo_dias} ${p.prazo_dias===1?'dia':'dias'}</td><td>${tipoLabel(p.tipo_dias)}</td><td class="n">${uses.get(p.id)||0}</td>
          <td class="act"><button class="btn sm" data-ed="${p.id}">Editar</button> <button class="btn sm danger" data-del="${p.id}">Excluir</button></td></tr>`).join('')}
        </tbody></table>` : `<div class="emptymsg">${prazos.length?'Nada encontrado com essa busca.':'Nenhum prazo cadastrado ainda. Use <b>+ Novo prazo</b> ou <b>Importar prazos</b>.'}</div>`}
    </div>`;
  $('#pzBody')._miss = miss;
  $('#pzCount').textContent = `${prazos.length} prazos cadastrados`;
  sizeWrap();
}
$('#pzBody').addEventListener('click', e=>{
  const s = e.target.closest('[data-s]'); if(s){ const k=s.dataset.s; pzSort = {k, dir: pzSort.k===k ? -pzSort.dir : 1}; return renderPrazos(); }

});

function prazoForm(p){
  p = p || {};
  const uniq = arr => [...new Set(arr.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const trs = uniq(rows.map(r=>r.transportador).concat(prazos.map(x=>x.transportadora)));
  const cids = uniq(rows.map(r=>r.cidade).concat(prazos.map(x=>x.cidade)));
  const body = `
    <div class="field"><label>Transportadora</label><input id="pfT" list="dlT" value="${esc(p.transportadora||'')}" autocomplete="off">
      <datalist id="dlT">${trs.map(t=>`<option value="${esc(t)}">`).join('')}</datalist></div>
    <div class="row2" style="grid-template-columns:1fr 110px">
      <div class="field"><label>Cidade</label><input id="pfC" list="dlC" value="${esc(p.cidade||'')}" placeholder="Vazio = todas as cidades" autocomplete="off">
        <datalist id="dlC">${cids.map(t=>`<option value="${esc(t)}">`).join('')}</datalist></div>
      <div class="field"><label>Estado</label><select id="pfU"><option value="">Todos</option>${UFS.map(u=>`<option ${u===(p.estado||'')?'selected':''}>${u}</option>`).join('')}</select></div>
    </div>
    <div class="row2">
      <div class="field"><label>Prazo (dias)</label><input id="pfD" type="number" min="0" step="1" value="${p.prazo_dias ?? ''}"></div>
      <div class="field"><label>Tipo de dias</label><select id="pfK"><option value="uteis" ${p.tipo_dias!=='corridos'?'selected':''}>Dias úteis</option><option value="corridos" ${p.tipo_dias==='corridos'?'selected':''}>Dias corridos</option></select></div>
    </div>
    <div class="field"><small>Cidade e estado vazios = prazo padrão da transportadora. Só o estado = vale para todas as cidades dele.<br>
      O prazo conta a partir da Data Coleta (sem coleta, usa a Data da NF). Dias úteis não contam sábado, domingo e feriados nacionais.</small></div>
    <div class="err" id="pfErr"></div>`;
  const m = modal(p.id ? 'Editar prazo' : 'Novo prazo', body, [
    {t:'Cancelar'},
    {t:'Salvar', cls:'primary', fn: async close=>{
      let cidade = $('#pfC').value.trim(), estado = $('#pfU').value;
      const sc = splitCidade(cidade); if(sc){ cidade = sc.cidade; estado = estado || sc.uf; }
      const rec = { transportadora: $('#pfT').value.trim(), cidade, estado, prazo_dias: $('#pfD').value==='' ? NaN : Number($('#pfD').value), tipo_dias: $('#pfK').value };
      if(!rec.transportadora) return $('#pfErr').textContent = 'Informe a transportadora.';
      if(!Number.isInteger(rec.prazo_dias) || rec.prazo_dias < 0) return $('#pfErr').textContent = 'Informe o prazo em dias (número inteiro).';
      const dup = prazoMap.get(pzKey(rec.transportadora, rec.cidade, rec.estado));
      const id = p.id || dup?.id;
      if(p.id && dup && dup.id !== p.id) return $('#pfErr').textContent = 'Já existe um prazo para essa transportadora, cidade e estado.';
      const q = id ? supa.from('prazos_entrega').update(rec).eq('id', id) : supa.from('prazos_entrega').insert(rec);
      const {data, error} = await q.select().single();
      if(error) return $('#pfErr').textContent = error.message;
      prazos = prazos.filter(x=>x.id!==data.id).concat([data]);
      close(); afterPrazosChange(); toast(!p.id && dup ? 'Já existia — prazo atualizado' : 'Prazo salvo');
    }}
  ]);
  setTimeout(()=> (p.transportadora ? m.ov.querySelector('#pfD') : m.ov.querySelector('#pfT')).focus(), 30);
  m.ov.addEventListener('keydown', e=>{ if(e.key==='Enter' && e.target.tagName==='INPUT'){ e.preventDefault(); m.ov.querySelector('.ft .primary').click(); } });
}

$('#pzImport').onclick = ()=> $('#pzFile').click();
$('#pzFile').addEventListener('change', async e=>{
  const f = e.target.files[0]; e.target.value=''; if(!f) return;
  let rd;
  try{ rd = readSheet(XLSX.read(await f.arrayBuffer(), {type:'array'}), ['transportadora','transportador']); }
  catch(err){ return toast('Não consegui ler o arquivo: '+err.message, true); }
  if(!rd) return toast('Não achei a coluna "Transportadora" na planilha.', true);
  const H = rd.aoa[rd.hIdx].map(normHeader);
  const ix = names => H.findIndex(h=>names.includes(h));
  const iT = ix(['transportadora','transportador']), iC = ix(['cidade','destino','cidadedestino']), iU = ix(['estado','uf']),
        iD = ix(['prazo','prazodias','prazoemdias','dias','prazodeentrega']), iK = ix(['tipo','tipodias','tipodedias']);
  if(iD < 0) return toast('Não achei a coluna "Prazo em Dias" na planilha.', true);
  const recs = new Map(); let bad = 0;
  rd.aoa.slice(rd.hIdx+1).forEach(r=>{
    const t = String(r[iT] ?? '').trim(); if(!t){ if(r.some(v=>v!==null&&v!=='')) bad++; return; }
    const d = Number(String(r[iD] ?? '').replace(/\D/g,'')); if(r[iD]===null || r[iD]==='' || !Number.isInteger(d)){ bad++; return; }
    let c = iC>=0 ? String(r[iC] ?? '').trim() : '', u = iU>=0 ? String(r[iU] ?? '').trim().toUpperCase() : '';
    const sc = splitCidade(c); if(sc){ c = sc.cidade; u = u || sc.uf; }
    if(u && !UFS.includes(u)){ bad++; return; }
    const k = iK>=0 && /corr/i.test(String(r[iK]||'')) ? 'corridos' : 'uteis';
    recs.set(pzKey(t,c,u), {transportadora:t, cidade:c, estado:u, prazo_dias:d, tipo_dias:k});
  });
  const list = [...recs.entries()];
  if(!list.length) return toast('Nenhum prazo válido na planilha.', true);
  const upd = list.filter(([key])=>prazoMap.has(key)), ins = list.filter(([key])=>!prazoMap.has(key));
  modal('Importar prazos', `<div class="kv"><span>Prazos na planilha</span><b>${list.length}</b><span>Novos</span><b>${ins.length}</b>
      <span>Já cadastrados (serão atualizados)</span><b>${upd.length}</b>${bad?`<span>Linhas ignoradas</span><b>${bad}</b>`:''}</div>
      <div class="warn">Colunas lidas: Transportadora, Cidade, Estado, Prazo em Dias e Tipo de Dias (Úteis ou Corridos; vazio = úteis). Cidade e estado vazios = prazo padrão da transportadora.</div>`,
    [{t:'Cancelar'},{t:'Importar', cls:'primary', fn: async (close, ov)=>{
      ov.dataset.lock=1; ov.querySelectorAll('.ft .btn').forEach(b=>b.disabled=true);
      for(let i=0;i<ins.length;i+=500){
        const {error} = await supa.from('prazos_entrega').insert(ins.slice(i,i+500).map(x=>x[1]));
        if(error){ close(); toast('Erro: '+error.message, true); return loadPrazos().then(afterPrazosChange); }
      }
      for(const [key, rec] of upd){
        const {error} = await supa.from('prazos_entrega').update(rec).eq('id', prazoMap.get(key).id);
        if(error){ close(); toast('Erro: '+error.message, true); return loadPrazos().then(afterPrazosChange); }
      }
      close(); await loadPrazos(); afterPrazosChange(); toast(`Prazos importados: ${ins.length} novos, ${upd.length} atualizados`);
    }}]);
});
$('#pzExport').onclick = ()=>{
  const list = [...prazos].sort((a,b)=>a.transportadora.localeCompare(b.transportadora,'pt-BR')||String(a.estado).localeCompare(String(b.estado))||a.cidade.localeCompare(b.cidade,'pt-BR'));
  const aoa = [['Transportadora','Cidade','Estado','Prazo em Dias','Tipo de Dias']].concat(list.map(p=>[p.transportadora, p.cidade||null, p.estado||null, p.prazo_dias, p.tipo_dias==='corridos'?'Corridos':'Úteis']));
  writeXlsx(aoa, ['text','text','text','int','text'], [36,28,10,14,14], 'Prazos', `prazos_entrega_${stampName()}.xlsx`);
};

/* ---------------- dados ---------------- */
async function loadPrazos(){
  const {data, error} = await supa.from('prazos_entrega').select('*');
  if(error){ toast('Erro ao carregar prazos: '+error.message+' — rode o script supabase_atualizacao_v2.sql', true); prazos=[]; }
  else prazos = data;
  buildPrazoMap();
}
async function loadAll(){
  loading(true, 'Carregando pedidos…');
  const all = []; const size = 1000;
  for(let from=0;;from+=size){
    const {data, error} = await supa.from('pedidos').select('*').order('pedido', {ascending:false}).range(from, from+size-1);
    if(error){ loading(false); toast('Erro ao carregar: '+error.message, true); return; }
    all.push(...data); if(data.length < size) break;
  }
  await loadPrazos();
  rows = all; indexRows(); loading(false); render();
}
let rtT;
function subscribeRealtime(){
  supa.channel('rastreio-rt')
  .on('postgres_changes', {event:'*', schema:'public', table:'pedidos'}, p=>{
    if(importing) return;
    if(p.eventType==='DELETE'){ const id=p.old?.pedido; rows = rows.filter(r=>r.pedido!==id); }
    else { const n=p.new; if(p.old?.pedido && p.old.pedido!==n.pedido) rows = rows.filter(r=>r.pedido!==p.old.pedido);
      const cur = rows.find(r=>r.pedido===n.pedido); cur ? Object.assign(cur,n) : rows.push(n); }
    indexRows(); clearTimeout(rtT); rtT = setTimeout(render, 250);
  })
  .on('postgres_changes', {event:'*', schema:'public', table:'prazos_entrega'}, p=>{
    if(p.eventType==='DELETE') prazos = prazos.filter(x=>x.id!==p.old?.id);
    else prazos = prazos.filter(x=>x.id!==p.new.id).concat([p.new]);
    buildPrazoMap(); indexRows(); clearTimeout(rtT); rtT = setTimeout(render, 250);
  })
  .subscribe();
}
/* recalcula "Atrasado / Vence hoje" quando vira o dia com a tela aberta */
let lastDay = todayISO();
setInterval(()=>{ if(todayISO()!==lastDay){ lastDay=todayISO(); indexRows(); render(); } }, 60000);

/* ---------------- inicialização ---------------- */
function show(id){ ['#scrCfg','#scrLogin','#scrApp'].forEach(s=>$(s).classList.toggle('hidden', s!==id)); if(id==='#scrApp') sizeWrap(); }
function getCfg(){ if(SUPABASE_URL && SUPABASE_ANON_KEY) return {url:SUPABASE_URL.replace(/\/rest\/v1\/?$/,'').replace(/\/+$/,''), key:SUPABASE_ANON_KEY, fixed:true}; return ls.get(LS_CFG); }
$('#cfgForm').onsubmit = e=>{ e.preventDefault();
  const url=$('#cfgUrl').value.trim().replace(/\/rest\/v1\/?$/,'').replace(/\/+$/,''), key=$('#cfgKey').value.trim();
  if(!/^https:\/\/.+/.test(url)){ $('#cfgErr').textContent='A URL deve começar com https://'; return; }
  ls.set(LS_CFG, {url, key}); location.reload(); };
$('#lgCfg').onclick = ()=>{ const c=getCfg(); if(c?.fixed){ toast('A conexão está fixa no código do arquivo.'); return; } $('#cfgUrl').value=c?.url||''; $('#cfgKey').value=c?.key||''; show('#scrCfg'); };
$('#loginForm').onsubmit = async e=>{ e.preventDefault(); $('#lgErr').textContent=''; $('#lgBtn').disabled=true;
  const {error} = await supa.auth.signInWithPassword({email:$('#lgEmail').value.trim(), password:$('#lgPass').value});
  $('#lgBtn').disabled=false;
  if(error) $('#lgErr').textContent = /invalid/i.test(error.message) ? 'E-mail ou senha incorretos.' : error.message; };

async function start(){
  if(ls.get(LS_WRAP)){ document.body.classList.add('wrap-text'); $('#btnWrap').classList.add('primary'); }
  const cfg = getCfg();
  if(!cfg || !cfg.url || !cfg.key){ show('#scrCfg'); return; }
  if(!window.supabase){ document.body.innerHTML='<div class="gate"><div class="card"><h2>Sem conexão</h2><p>Não carregou a biblioteca do Supabase. Verifique a internet e recarregue.</p></div></div>'; return; }
  supa = window.supabase.createClient(cfg.url, cfg.key);
  let started = false;
  const enter = session => {
    if(!session){ show('#scrLogin'); return; }
    if(started) return; started = true;
    $('#userEmail').textContent = session.user?.email || '';
    show('#scrApp'); setTab(ls.get(LS_TAB)==='prazos' ? 'prazos' : 'pedidos'); loadAll(); subscribeRealtime();
  };
  supa.auth.onAuthStateChange((ev, session)=>{ if(ev==='SIGNED_OUT'){ started=false; show('#scrLogin'); } else if(session) enter(session); });
  const {data:{session}} = await supa.auth.getSession();
  enter(session);
}
start();
</script>
